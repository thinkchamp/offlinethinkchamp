<!DOCTYPE html>
<html>
<head>
    <title>Mini RAG Chatbot</title>

    <style>

        body{
            font-family:Arial;
            width:70%;
            margin:auto;
            margin-top:40px;
        }

        h1{
            text-align:center;
        }

        form{
            margin:20px 0;
        }

        input[type=file],
        input[type=text]{
            width:100%;
            padding:10px;
        }

        button{
            padding:10px 20px;
            margin-top:10px;
        }

        .answer{
            background:#f5f5f5;
            padding:15px;
            margin-top:20px;
            border-radius:10px;
        }

    </style>

</head>
<body>

<h1>Mini RAG Chatbot</h1>

<h3>Upload PDF</h3>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="pdf">
    <button type="submit">Upload</button>
</form>

<hr>

<h3>Ask Question</h3>

<form method="POST">
    <input type="text"
           name="question"
           placeholder="Ask a question...">
    <button type="submit">Ask</button>
</form>

<div class="answer">
    <b>Answer:</b><br>
    {{ answer }}
</div>

</body>
</html>
